name: Deploy to GitHub Pages

# Primary hosting is Vercel, which deploys from this repo automatically and needs no
# workflow. This is kept as a manual fallback only: it never runs on push, so it cannot
# produce failing builds in the Actions tab.
#
# To use it: Settings -> Pages -> Source: GitHub Actions, then run this workflow from the
# Actions tab. It builds with the repo-name sub-path that Pages requires.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # Pages serves this repo at username.github.io/<repo>, so the site needs that
        # sub-path baked in. Taken from the repo name so it stays correct if renamed.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
