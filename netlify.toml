[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Long-lived caching for hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Kept in step with vercel.json. Whichever host is used, the same headers apply.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jotfor.ms https://*.jotform.com; connect-src 'self' https://*.jotform.com https://cdn.jotfor.ms wss://*.jotform.com; frame-src https://*.jotform.com; media-src 'self' blob: https://*.jotform.com; worker-src 'self' blob:; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self \"https://www.jotform.com\" \"https://agent.jotform.com\")"
    Cross-Origin-Opener-Policy = "same-origin"
